<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitoring Stok &amp; Tools — TBS TCN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F4EF; --panel:#FFFFFF; --border:#E1DFD5; --border-strong:#C7C4B6;
  --text-primary:#16211F; --text-secondary:#57645F; --text-muted:#93998F;
  --accent:#0E7C86; --accent-light:#E3F1F0; --accent-dark:#0A5A62;
  --success:#1F8F53; --success-light:#E5F4EB;
  --warning:#B8790A; --warning-light:#FBF0DA;
  --danger:#C1392B; --danger-light:#FBEAE7;
  --radius:10px;
  --font-sans:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text-primary);font-family:var(--font-sans);}
body{padding:0 0 4rem;}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px;}
header.top{
  border-bottom:1px solid var(--border);
  background:
    linear-gradient(var(--bg),var(--bg)) padding-box,
    repeating-linear-gradient(90deg, var(--accent) 0 10px, transparent 10px 22px) bottom/100% 3px no-repeat;
  padding-bottom:14px; margin-bottom:8px;
}
.top-inner{display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:12px; padding-top:22px;}
.brand{display:flex; align-items:center; gap:12px;}
.brand-mark{
  width:38px;height:38px;border-radius:8px;background:var(--accent-dark);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.brand-mark span{width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.25);}
.brand h1{font-size:19px;font-weight:600;margin:0;letter-spacing:.2px;}
.brand p{margin:2px 0 0;font-size:12.5px;color:var(--text-secondary);font-family:var(--font-mono);}
.top-meta{font-size:12px;color:var(--text-muted);text-align:right;}
.top-meta button{margin-top:6px;}

nav.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:14px 0 22px;border-bottom:1px solid var(--border);padding-bottom:0;}
nav.tabs button{
  border:none;background:transparent;padding:9px 14px;font-family:var(--font-sans);
  font-size:13.5px;font-weight:500;color:var(--text-secondary);cursor:pointer;border-radius:8px 8px 0 0;
  border-bottom:2px solid transparent; transition:.15s;
}
nav.tabs button:hover{color:var(--text-primary);background:rgba(0,0,0,.03);}
nav.tabs button.active{color:var(--accent-dark);border-bottom:2px solid var(--accent);background:var(--accent-light);}

.regis-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.regis-chip{
  display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;
  background:#F0EFE9;border:1px solid var(--border-strong);border-radius:6px;padding:4px 6px 4px 9px;color:var(--text-primary);
}
.regis-chip button{
  border:none;background:var(--accent-light);color:var(--accent-dark);border-radius:4px;
  font-family:var(--font-sans);font-size:10.5px;font-weight:500;padding:2px 6px;cursor:pointer;
}
.regis-chip button:hover{background:var(--accent);color:#fff;}
.expand-btn{background:none;border:none;color:var(--accent-dark);font-size:12px;font-weight:500;cursor:pointer;padding:2px 0;}
.expand-btn:hover{text-decoration:underline;}
.rowdetail{background:var(--accent-light);}
.rowdetail td{padding:12px 14px;}

.modal-overlay{
  position:fixed;inset:0;background:rgba(20,25,23,.45);display:flex;align-items:center;justify-content:center;
  z-index:80;padding:20px;
}
.modal{background:#fff;border-radius:12px;max-width:420px;width:100%;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.25);}
.modal h3{margin:0 0 4px;font-size:15px;font-weight:600;}
.modal p.sub{margin:0 0 16px;font-size:12.5px;color:var(--text-secondary);}
.modal .barcode-box{background:#fff;border:1px solid var(--border);border-radius:8px;padding:14px;text-align:center;margin-bottom:14px;}
.modal .barcode-box svg{max-width:100%;}
.modal .barcode-label{font-size:12px;color:var(--text-secondary);margin-top:6px;}
.modal .barcode-label b{color:var(--text-primary);font-family:var(--font-mono);}
.modal .actions{display:flex;gap:10px;justify-content:flex-end;}

#printSheet{display:none;}
@media print{
  header.top, nav.tabs, .toolbar, form.entry, .actionscell, .expand-btn, #resetBtn, .top-meta { display:none !important; }
  body *{visibility:hidden;}
  #printSheet, #printSheet *{visibility:visible;}
  #printSheet{display:block !important;position:absolute;left:0;top:0;width:100%;}
  .print-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .print-card{border:1px solid #999;border-radius:6px;padding:10px;text-align:center;page-break-inside:avoid;}
  .print-card svg{max-width:100%;}
  .print-card .pc-name{font-size:10px;margin-top:4px;}
  .print-card .pc-kode{font-size:9px;color:#555;font-family:var(--font-mono);}
}

.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px 22px;margin-bottom:18px;}
.panel h2{font-size:16px;font-weight:600;margin:0 0 4px;}
.panel .sub{font-size:12.5px;color:var(--text-secondary);margin:0 0 16px;}

.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px;}
.metric{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px;}
.metric .label{font-size:12px;color:var(--text-secondary);margin:0 0 6px;}
.metric .value{font-size:26px;font-weight:600;margin:0;font-family:var(--font-mono);}
.metric .value.accent{color:var(--accent-dark);}
.metric .value.warn{color:var(--warning);}
.metric .value.danger{color:var(--danger);}

.statusbar{display:flex;height:10px;border-radius:6px;overflow:hidden;margin:10px 0 12px;border:1px solid var(--border);}
.statusbar div{height:100%;}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--text-secondary);margin-bottom:4px;}
.legend .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle;}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
.toolbar input[type=text], .toolbar select{
  font-family:var(--font-sans);font-size:13px;padding:8px 10px;border:1px solid var(--border-strong);
  border-radius:8px;background:#fff;color:var(--text-primary);
}
.toolbar input[type=text]{min-width:220px;flex:1;}
.btn{
  font-family:var(--font-sans);font-size:13px;font-weight:500;padding:8px 14px;border-radius:8px;
  border:1px solid var(--border-strong);background:#fff;color:var(--text-primary);cursor:pointer;transition:.12s;
}
.btn:hover{background:#f5f4f0;border-color:var(--text-muted);}
.btn:active{transform:scale(.98);}
.btn.primary{background:var(--accent);border-color:var(--accent-dark);color:#fff;}
.btn.primary:hover{background:var(--accent-dark);}
.btn.danger-outline{color:var(--danger);border-color:#e6b9b2;}
.btn.danger-outline:hover{background:var(--danger-light);}
.btn.small{padding:5px 10px;font-size:12px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{
  text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);
  font-weight:500;padding:8px 10px;border-bottom:1px solid var(--border-strong);position:sticky;top:0;background:var(--panel);
}
tbody td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:top;}
tbody tr:hover{background:rgba(14,124,134,.035);}
.tablewrap{max-height:520px;overflow:auto;border:1px solid var(--border);border-radius:10px;}
code.k{font-family:var(--font-mono);font-size:12px;background:#F0EFE9;padding:2px 6px;border-radius:5px;color:var(--accent-dark);}
.num{font-family:var(--font-mono);text-align:right;}
.muted{color:var(--text-muted);}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;padding:3px 9px;border-radius:20px;white-space:nowrap;}
.pill .d{width:7px;height:7px;border-radius:50%;}
.pill.ok{background:var(--success-light);color:#186B3E;}
.pill.ok .d{background:var(--success);}
.pill.warn{background:var(--warning-light);color:#8A5C06;}
.pill.warn .d{background:var(--warning);}
.pill.off{background:#EFEEE7;color:var(--text-secondary);}
.pill.off .d{background:var(--text-muted);}
.pill.borrowed{background:var(--danger-light);color:#8E2A1F;}
.pill.borrowed .d{background:var(--danger);}

form.entry{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px;padding:16px;background:var(--accent-light);border-radius:10px;border:1px solid #CFE6E4;}
form.entry .field{display:flex;flex-direction:column;gap:4px;}
form.entry .field.wide{grid-column:span 2;}
form.entry label{font-size:11.5px;font-weight:500;color:var(--accent-dark);}
form.entry input,form.entry select{
  font-family:var(--font-sans);font-size:13px;padding:8px 9px;border:1px solid #BEDAD8;border-radius:7px;background:#fff;
}
form.entry .actions{grid-column:1/-1;display:flex;gap:10px;align-items:center;margin-top:2px;}
.err{font-size:12px;color:var(--danger);margin:0;}
.hint{font-size:12px;color:var(--text-muted);margin:0;}

.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--text-primary);color:#fff;padding:11px 18px;border-radius:9px;font-size:13px;
  opacity:0;transition:.25s;pointer-events:none;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.18);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.err{background:var(--danger);}

.empty{padding:30px;text-align:center;color:var(--text-muted);font-size:13px;}
.count{font-size:12px;color:var(--text-muted);margin-left:auto;}
.section-flex{display:flex;gap:20px;flex-wrap:wrap;}
.section-flex>div{flex:1;min-width:280px;}
.hist-item{font-size:12.5px;padding:8px 0;border-bottom:1px dashed var(--border);}
.hist-item b{font-weight:500;}
.actionscell{display:flex;gap:6px;flex-wrap:wrap;}
@media (max-width:640px){
  form.entry{grid-template-columns:1fr 1fr;}
  form.entry .field.wide{grid-column:1/-1;}
}
</style>
</head>

<script>
// ---------- state ----------
let DATA = null;
let ACTIVE_TAB = 'dashboard';
const STORAGE_KEY = 'tcn-stock-state-v1';

function todayStr(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()}`;
}

const BULAN_NAMA = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
function currentPeriode(){
  const d = new Date();
  return {key: `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`, label: `${BULAN_NAMA[d.getMonth()]} ${d.getFullYear()}`};
}

function toast(msg, isErr){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=> t.className='toast', 2600);
}

// ---------- persistence backend detection ----------
// Works in two environments with the same code:
// 1) Claude.ai artifact preview -> uses window.storage (per-user, sandboxed)
// 2) Deployed on Vercel (or any static host) -> uses /api/state (shared server-side storage)
const HAS_CLAUDE_STORAGE = typeof window.storage === 'object' && window.storage && typeof window.storage.get === 'function';

async function backendGet(){
  if(HAS_CLAUDE_STORAGE){
    const res = await window.storage.get(STORAGE_KEY, false);
    return res && res.value ? JSON.parse(res.value) : null;
  }
  const res = await fetch('/api/state');
  if(!res.ok) throw new Error('gagal mengambil data dari server (' + res.status + ')');
  const json = await res.json();
  return json && json.value ? json.value : null;
}

async function backendSet(data){
  if(HAS_CLAUDE_STORAGE){
    await window.storage.set(STORAGE_KEY, JSON.stringify(data), false);
    return;
  }
  const res = await fetch('/api/state', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(data)
  });
  if(!res.ok) throw new Error('gagal menyimpan data ke server (' + res.status + ')');
}

async function checkMonthlyOpnameReset(){
  const cur = currentPeriode();
  DATA.stockOpname.archive = DATA.stockOpname.archive || [];
  if(!DATA.stockOpname.periode){
    DATA.stockOpname.periode = cur;
    return;
  }
  if(DATA.stockOpname.periode.key !== cur.key){
    const totalMaster = allRegisFlat().length;
    const checkedCount = Object.keys(DATA.stockOpname.checked || {}).length;
    const newCount = (DATA.stockOpname.unlisted || []).length;
    DATA.stockOpname.archive.unshift({
      periode: DATA.stockOpname.periode.label,
      totalMaster, checked: checkedCount, unchecked: Math.max(totalMaster - checkedCount, 0), newFound: newCount
    });
    DATA.stockOpname.archive = DATA.stockOpname.archive.slice(0, 12);
    DATA.stockOpname.checked = {};
    DATA.stockOpname.unlisted = [];
    DATA.stockOpname.periode = cur;
    await saveState();
    toast(`Sesi Stock Opname bulan ${DATA.stockOpname.archive[0].periode} diarsipkan — periode baru: ${cur.label}`);
  }
}

function freshStockOpname(){
  const seed = (INITIAL_DATA.stockOpnameSeedUnlisted || []).map(u => ({regis: u.regis, date: null}));
  return {checked:{}, unlisted: seed, periode: currentPeriode(), archive: []};
}

async function loadState(){
  try{
    const remote = await backendGet();
    if(remote){
      DATA = remote;
      DATA.toolsHistory = DATA.toolsHistory || [];
      DATA.stockOpname = DATA.stockOpname || {checked:{}, unlisted:[], periode:null, archive:[]};
      DATA.stockOpname.archive = DATA.stockOpname.archive || [];
      await checkMonthlyOpnameReset();
      return;
    }
  }catch(e){
    console.error('gagal memuat data', e);
    toast(HAS_CLAUDE_STORAGE ? 'Gagal memuat data tersimpan, memakai data awal' : 'Gagal terhubung ke server, memakai data awal (perubahan tidak akan tersimpan)', true);
  }
  DATA = JSON.parse(JSON.stringify(INITIAL_DATA));
  DATA.toolsHistory = DATA.toolsHistory || [];
  DATA.stockOpname = freshStockOpname();
  await saveState();
}

async function saveState(){
  try{
    await backendSet(DATA);
  }catch(e){
    console.error('gagal menyimpan', e);
    toast('Gagal menyimpan perubahan — periksa koneksi internet', true);
  }
}

async function resetState(){
  showConfirmModal(
    'Reset ke data awal?',
    'Kembalikan semua data ke kondisi awal file yang diunggah? Perubahan yang sudah dicatat (transaksi, peminjaman tools, stock opname) akan hilang untuk SEMUA orang yang memakai aplikasi ini.',
    async ()=>{
      DATA = JSON.parse(JSON.stringify(INITIAL_DATA));
      DATA.toolsHistory = [];
      DATA.stockOpname = freshStockOpname();
      await saveState();
      toast('Data direset ke kondisi awal');
      renderAll();
    }
  );
}

function showConfirmModal(title, body, onConfirm){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
  <div class="modal-overlay" id="cfOverlay">
    <div class="modal">
      <h3>${esc(title)}</h3>
      <p class="sub">${esc(body)}</p>
      <div class="actions">
        <button class="btn" id="cfCancel">Batal</button>
        <button class="btn danger-outline" id="cfOk">Ya, lanjutkan</button>
      </div>
    </div>
  </div>`;
  const close = ()=> root.innerHTML='';
  document.getElementById('cfCancel').addEventListener('click', close);
  document.getElementById('cfOverlay').addEventListener('click', e=>{ if(e.target.id==='cfOverlay') close(); });
  document.getElementById('cfOk').addEventListener('click', ()=>{ close(); onConfirm(); });
}

// ---------- helpers ----------
function findMasterName(kode){
  if(!kode) return null;
  const m = DATA.masterKodeSpek.find(r => r['KODE SPEK'] === kode);
  if(m) return m['NAMA PERANGKAT'];
  const r = DATA.realStok.find(r => r.KODE_SPEK === kode);
  return r ? r.NAMA_PERANGKAT : null;
}

function getRealStokRow(kode){
  return DATA.realStok.find(r => r.KODE_SPEK === kode);
}

function ensureRealStokRow(kode, nama){
  let row = getRealStokRow(kode);
  if(!row){
    row = {
      KODE_SPEK: kode, NAMA_PERANGKAT: nama || findMasterName(kode) || kode,
      STOK_AWAL:0, MASUK_PSB:0, MASUK_PROJECT:0, MASUK_POC:0,
      KELUAR_PSB:0, KELUAR_PROJECT:0, KELUAR_POC:0, KELUAR_GGN_AKSES:0,
      STOCK_AKHIR:0, SPARE_GGN_TL:'KOSONG'
    };
    DATA.realStok.push(row);
  }
  return row;
}

function updateStatus(row){
  if(row.STOCK_AKHIR > 0){
    row.SPARE_GGN_TL = 'TERSEDIA';
  } else if(row.SPARE_GGN_TL === 'TERSEDIA'){
    row.SPARE_GGN_TL = 'KOSONG';
  }
}

function statusPill(status){
  if(status === 'TERSEDIA') return `<span class="pill ok"><span class="d"></span>Tersedia</span>`;
  if(status === 'SEGERA MR') return `<span class="pill warn"><span class="d"></span>Segera MR</span>`;
  return `<span class="pill off"><span class="d"></span>Kosong</span>`;
}

function fmtNum(n){
  if(n === null || n === undefined || isNaN(n)) return '—';
  return Number(n).toLocaleString('id-ID');
}
function esc(s){
  if(s===null||s===undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function copyTSV(headers, rows){
  const lines = [headers.join('\t'), ...rows.map(r => r.join('\t'))];
  const text = lines.join('\n');
  navigator.clipboard.writeText(text).then(()=> toast('Tabel disalin — siap tempel ke Excel'))
    .catch(()=> toast('Gagal menyalin ke clipboard', true));
}

// ---------- dashboard ----------
function computeMetrics(){
  const totalSKU = DATA.realStok.length;
  const totalStok = DATA.realStok.reduce((s,r)=> s + (Number(r.STOCK_AKHIR)||0), 0);
  const skuAda = DATA.realStok.filter(r => Number(r.STOCK_AKHIR) > 0).length;
  const kosong = DATA.realStok.filter(r => r.SPARE_GGN_TL === 'KOSONG').length;
  const segeraMR = DATA.realStok.filter(r => r.SPARE_GGN_TL === 'SEGERA MR').length;
  const tersedia = DATA.realStok.filter(r => r.SPARE_GGN_TL === 'TERSEDIA').length;
  const toolsDipinjam = DATA.tools.filter(t => t.STATUS === 'DIPINJAM').length;
  return {totalSKU, totalStok, skuAda, kosong, segeraMR, tersedia, toolsDipinjam, toolsTotal: DATA.tools.length};
}

// ---------- real stok ----------
let realStokFilter = {q:'', status:''};
let expandedRows = new Set();

function regisList(kode){
  return (DATA.regisByKode && DATA.regisByKode[kode]) || [];
}

function rowMatchesQuery(r, q){
  if(!q) return true;
  if((r.KODE_SPEK||'').toLowerCase().includes(q)) return true;
  if((r.NAMA_PERANGKAT||'').toLowerCase().includes(q)) return true;
  const list = regisList(r.KODE_SPEK);
  return list.some(reg => (reg||'').toLowerCase().includes(q));
}

function renderRealStok(){
  const q = realStokFilter.q.trim().toLowerCase();
  const st = realStokFilter.status;
  let rows = DATA.realStok.filter(r => rowMatchesQuery(r, q) && (!st || r.SPARE_GGN_TL === st));
  rows = [...rows].sort((a,b)=> (b.STOCK_AKHIR||0)-(a.STOCK_AKHIR||0));

  return `
  <div class="panel">
    <h2>Real Stok</h2>
    <p class="sub">Stok akhir perangkat, diperbarui otomatis oleh transaksi Barang Masuk &amp; Barang Keluar. Cari juga bisa pakai nomor registrasi unit lengkap.</p>
    <div class="toolbar">
      <input type="text" id="rsSearch" placeholder="Cari kode spek, nama perangkat, atau no. registrasi lengkap…" value="${esc(realStokFilter.q)}">
      <select id="rsStatus">
        <option value="">Semua status</option>
        <option value="TERSEDIA" ${st==='TERSEDIA'?'selected':''}>Tersedia</option>
        <option value="SEGERA MR" ${st==='SEGERA MR'?'selected':''}>Segera MR</option>
        <option value="KOSONG" ${st==='KOSONG'?'selected':''}>Kosong</option>
      </select>
      <button class="btn" id="rsCopy">Salin tabel ke Excel</button>
      <button class="btn primary" id="rsPrintAll">Cetak semua barcode stok</button>
      <span class="count">${fmtNum(rows.length)} dari ${fmtNum(DATA.realStok.length)} SKU</span>
    </div>
    <div class="tablewrap">
    <table>
      <thead><tr><th></th><th>Kode spek</th><th>Nama perangkat</th><th style="text-align:right">Stok awal</th><th style="text-align:right">Stok akhir</th><th>Status</th><th>No. registrasi</th></tr></thead>
      <tbody>
        ${rows.length ? rows.map(r => {
          const list = regisList(r.KODE_SPEK);
          const isOpen = expandedRows.has(r.KODE_SPEK);
          const rowHtml = `<tr>
          <td>${list.length ? `<button class="expand-btn" data-expand="${esc(r.KODE_SPEK)}">${isOpen?'▾':'▸'}</button>` : ''}</td>
          <td><code class="k">${esc(r.KODE_SPEK)}</code></td>
          <td>${esc(r.NAMA_PERANGKAT)}</td>
          <td class="num muted">${fmtNum(r.STOK_AWAL)}</td>
          <td class="num"><b>${fmtNum(r.STOCK_AKHIR)}</b></td>
          <td>${statusPill(r.SPARE_GGN_TL)}</td>
          <td class="muted">${list.length ? `${list.length} unit${q && list.some(x=>(x||'').toLowerCase().includes(q)) ? ' — cocok' : ''}` : '—'}</td>
        </tr>`;
          const detailHtml = (list.length && isOpen) ? `<tr class="rowdetail"><td colspan="7">
            <div class="hint" style="margin-bottom:6px">${list.length} nomor registrasi unit untuk ${esc(r.KODE_SPEK)}:</div>
            <div class="regis-list">
              ${list.map(reg => `<span class="regis-chip">${esc(reg)}<button data-barcode="${esc(reg)}" data-nama="${esc(r.NAMA_PERANGKAT)}" data-kode="${esc(r.KODE_SPEK)}">Barcode</button></span>`).join('')}
            </div>
          </td></tr>` : '';
          return rowHtml + detailHtml;
        }).join('') : `<tr><td colspan="7" class="empty">Tidak ada SKU yang cocok</td></tr>`}
      </tbody>
    </table>
    </div>
  </div>
  `;
}

function wireRealStok(){
  document.getElementById('rsSearch').addEventListener('input', e=>{ realStokFilter.q = e.target.value; renderTabInto(); });
  document.getElementById('rsStatus').addEventListener('change', e=>{ realStokFilter.status = e.target.value; renderTabInto(); });
  document.getElementById('rsCopy').addEventListener('click', ()=>{
    const q = realStokFilter.q.trim().toLowerCase();
    const st = realStokFilter.status;
    const rows = DATA.realStok.filter(r => rowMatchesQuery(r, q) && (!st || r.SPARE_GGN_TL === st));
    copyTSV(['Kode Spek','Nama Perangkat','Stok Awal','Stok Akhir','Status','No Registrasi'],
      rows.map(r=>[r.KODE_SPEK, r.NAMA_PERANGKAT, r.STOK_AWAL, r.STOCK_AKHIR, r.SPARE_GGN_TL, regisList(r.KODE_SPEK).join(', ')]));
  });
  document.getElementById('rsPrintAll').addEventListener('click', printAllBarcodes);
  document.querySelectorAll('[data-expand]').forEach(b => b.addEventListener('click', ()=>{
    const kode = b.dataset.expand;
    if(expandedRows.has(kode)) expandedRows.delete(kode); else expandedRows.add(kode);
    renderTabInto();
  }));
  document.querySelectorAll('[data-barcode]').forEach(b => b.addEventListener('click', ()=>{
    showBarcodeModal(b.dataset.barcode, b.dataset.nama, b.dataset.kode);
  }));
}

// ---------- barcode modal ----------
function showBarcodeModal(regis, nama, kode){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
  <div class="modal-overlay" id="bcOverlay">
    <div class="modal">
      <h3>Barcode unit</h3>
      <p class="sub">${esc(nama)} · <code class="k">${esc(kode)}</code></p>
      <div class="barcode-box">
        <svg id="bcSvg"></svg>
        <div class="barcode-label">No. registrasi: <b>${esc(regis)}</b></div>
      </div>
      <div class="actions">
        <button class="btn" id="bcClose">Tutup</button>
        <button class="btn primary" id="bcPrint">Cetak</button>
      </div>
    </div>
  </div>`;
  if(typeof JsBarcode === 'undefined'){
    document.getElementById('bcSvg').outerHTML = `<p class="err">Library barcode belum termuat — pastikan perangkat terhubung ke internet saat membuka file ini, lalu coba lagi.</p>`;
  } else {
    try{
      JsBarcode('#bcSvg', regis, {format:'CODE128', width:2, height:60, fontSize:12, margin:8});
    }catch(e){
      document.getElementById('bcSvg').outerHTML = `<p class="err">Gagal membuat barcode: ${esc(e.message||'nilai tidak didukung')}</p>`;
    }
  }
  document.getElementById('bcClose').addEventListener('click', ()=> root.innerHTML='');
  document.getElementById('bcOverlay').addEventListener('click', e=>{ if(e.target.id==='bcOverlay') root.innerHTML=''; });
  document.getElementById('bcPrint').addEventListener('click', ()=>{
    printSingleBarcode(regis, nama, kode);
  });
}

function printSingleBarcode(regis, nama, kode){
  if(typeof JsBarcode === 'undefined'){ toast('Library barcode belum termuat — cek koneksi internet', true); return; }
  const sheet = document.getElementById('printSheet');
  sheet.innerHTML = `<div class="print-grid"><div class="print-card">
    <svg id="printSvgSingle"></svg>
    <div class="pc-name">${esc(nama)}</div>
    <div class="pc-kode">${esc(kode)} · ${esc(regis)}</div>
  </div></div>`;
  JsBarcode('#printSvgSingle', regis, {format:'CODE128', width:2, height:55, fontSize:11, margin:6});
  window.print();
}

function printAllBarcodes(){
  const items = [];
  DATA.realStok.forEach(r => {
    if(Number(r.STOCK_AKHIR) > 0){
      const list = regisList(r.KODE_SPEK);
      if(list.length){
        list.forEach(reg => items.push({reg, nama: r.NAMA_PERANGKAT, kode: r.KODE_SPEK}));
      }
    }
  });
  if(!items.length){ toast('Tidak ada unit dengan nomor registrasi untuk dicetak', true); return; }
  if(typeof JsBarcode === 'undefined'){ toast('Library barcode belum termuat — cek koneksi internet', true); return; }
  const sheet = document.getElementById('printSheet');
  sheet.innerHTML = `<div class="print-grid">${items.map((it,i) => `<div class="print-card">
    <svg id="pbc${i}"></svg>
    <div class="pc-name">${esc(it.nama)}</div>
    <div class="pc-kode">${esc(it.kode)} · ${esc(it.reg)}</div>
  </div>`).join('')}</div>`;
  items.forEach((it,i) => {
    try{ JsBarcode(`#pbc${i}`, it.reg, {format:'CODE128', width:1.6, height:45, fontSize:9, margin:4}); }catch(e){}
  });
  toast(`Menyiapkan ${items.length} barcode untuk dicetak…`);
  setTimeout(()=> window.print(), 200);
}

async function handleMasukSubmit(e){
  e.preventDefault();
  const f = e.target;
  const errEl = document.getElementById('masukErr');
  errEl.textContent = '';
  const kode = f.KODE_SPEK.value.trim().toUpperCase();
  const jumlah = parseInt(f.JUMLAH.value, 10);
  if(!kode){ errEl.textContent = 'Kode spek wajib diisi'; return; }
  if(!jumlah || jumlah <= 0){ errEl.textContent = 'Jumlah harus angka lebih dari 0'; return; }
  const tujuan = f.TUJUAN.value;
  const nama = findMasterName(kode);

  const row = ensureRealStokRow(kode, nama);
  row.STOCK_AKHIR = (Number(row.STOCK_AKHIR)||0) + jumlah;
  if(tujuan === 'PSB') row.MASUK_PSB = (Number(row.MASUK_PSB)||0) + jumlah;
  else if(tujuan === 'PROJECT') row.MASUK_PROJECT = (Number(row.MASUK_PROJECT)||0) + jumlah;
  else if(tujuan === 'POC') row.MASUK_POC = (Number(row.MASUK_POC)||0) + jumlah;
  updateStatus(row);

  const regisRaw = (f.NO_REG_UNIT.value || '').split('\n').map(s=>s.trim()).filter(Boolean);
  if(regisRaw.length){
    DATA.regisByKode = DATA.regisByKode || {};
    DATA.regisByKode[kode] = (DATA.regisByKode[kode] || []).concat(regisRaw);
  }

  const entry = {
    TANGGAL: f.TANGGAL.value || todayStr(), KET_ASAL: f.KET_ASAL.value || null,
    NOJAR: f.NOJAR.value || null, PJ: f.PJ.value || null, NO_REG: regisRaw.join(', ') || null,
    KODE_SPEK: kode, NAMA_PERANGKAT: row.NAMA_PERANGKAT, TUJUAN: tujuan,
    PSB: tujuan==='PSB'?jumlah:0, PROJECT: tujuan==='PROJECT'?jumlah:0, POC: tujuan==='POC'?jumlah:0,
    STOCK_TBS: tujuan==='STOCK TBS'?jumlah:0, CEK:'DONE'
  };
  DATA.barangMasuk.push(entry);
  await saveState();
  toast(`Barang masuk dicatat — stok ${kode} kini ${fmtNum(row.STOCK_AKHIR)} unit`);
  renderTabInto();
}

function wireMasuk(){
  document.getElementById('masukForm').addEventListener('submit', handleMasukSubmit);
  document.getElementById('masukCopy').addEventListener('click', ()=>{
    const rows = [...DATA.barangMasuk].reverse();
    copyTSV(['Tanggal','Kode Spek','Nama Perangkat','Tujuan','Jumlah','Keterangan Asal','Cek'],
      rows.map(r=>[r.TANGGAL, r.KODE_SPEK, r.NAMA_PERANGKAT, r.TUJUAN, (r.PSB||0)+(r.PROJECT||0)+(r.POC||0)+(r.STOCK_TBS||0), r.KET_ASAL, r.CEK]));
  });
}

async function handleKeluarSubmit(e){
  e.preventDefault();
  const f = e.target;
  const errEl = document.getElementById('keluarErr');
  errEl.textContent = '';
  const kode = f.KODE_SPEK.value.trim().toUpperCase();
  const jumlah = parseInt(f.JUMLAH.value, 10);
  if(!kode){ errEl.textContent = 'Kode spek wajib diisi'; return; }
  if(!jumlah || jumlah <= 0){ errEl.textContent = 'Jumlah harus angka lebih dari 0'; return; }
  const row = getRealStokRow(kode);
  const stokTersedia = row ? Number(row.STOCK_AKHIR)||0 : 0;
  if(jumlah > stokTersedia){
    errEl.textContent = `Stok tidak mencukupi — tersedia ${fmtNum(stokTersedia)} unit`;
    return;
  }
  const tujuan = f.TUJUAN.value;
  row.STOCK_AKHIR = stokTersedia - jumlah;
  if(tujuan==='PSB') row.KELUAR_PSB = (Number(row.KELUAR_PSB)||0)+jumlah;
  else if(tujuan==='PROJECT') row.KELUAR_PROJECT = (Number(row.KELUAR_PROJECT)||0)+jumlah;
  else if(tujuan==='POC') row.KELUAR_POC = (Number(row.KELUAR_POC)||0)+jumlah;
  else if(tujuan==='GGN_AKSES') row.KELUAR_GGN_AKSES = (Number(row.KELUAR_GGN_AKSES)||0)+jumlah;
  updateStatus(row);

  const regisRaw = (f.NO_REG_UNIT.value || '').split('\n').map(s=>s.trim()).filter(Boolean);
  if(regisRaw.length && DATA.regisByKode && DATA.regisByKode[kode]){
    regisRaw.forEach(reg => {
      const idx = DATA.regisByKode[kode].indexOf(reg);
      if(idx > -1) DATA.regisByKode[kode].splice(idx, 1);
    });
  }

  const entry = {
    PEKERJAAN_TYPE: null, PEKERJAAN: tujuan.replace('_',' '), C: null,
    NO_REG: null, KODE_SPEK: kode, NAMA_PERANGKAT: row.NAMA_PERANGKAT,
    PSB: tujuan==='PSB'?jumlah:0, PROJECT: tujuan==='PROJECT'?jumlah:0, POC: tujuan==='POC'?jumlah:0,
    GGN_AKSES: tujuan==='GGN_AKSES'?jumlah:0, MUTASI: tujuan==='MUTASI'?jumlah:0, CLUSTER_LAIN: tujuan==='CLUSTER_LAIN'?jumlah:0,
    PJ: f.PJ.value || null, PEMINJAM: f.PEMINJAM.value || null, NOJAR_SA: f.NOJAR_SA.value || null,
    NAMA_PELANGGAN: f.NAMA_PELANGGAN.value || null, STATUS: f.STATUS.value, CEK_STATUS: null,
    NO_REG: regisRaw.join(', ') || null
  };
  DATA.barangKeluar.push(entry);
  await saveState();
  toast(`Barang keluar dicatat — sisa stok ${kode}: ${fmtNum(row.STOCK_AKHIR)} unit`);
  renderTabInto();
}

function wireKeluar(){
  document.getElementById('keluarForm').addEventListener('submit', handleKeluarSubmit);
  document.getElementById('keluarCopy').addEventListener('click', ()=>{
    const rows = [...DATA.barangKeluar].reverse();
    copyTSV(['Kode Spek','Nama Perangkat','Pekerjaan/Tujuan','Jumlah','PJ','Nama Pelanggan','Status'],

}

let opnameFilter = {q:'', status:''};

function allRegisFlat(){
  const arr = [];
  const map = DATA.regisByKode || {};
  Object.keys(map).forEach(kode => {
    const row = getRealStokRow(kode);
    const nama = (row && row.NAMA_PERANGKAT) || findMasterName(kode) || kode;
    (map[kode] || []).forEach(regis => { if(regis) arr.push({regis, kode, nama}); });
  });
  return arr;
}

function opnameCombinedList(){
  const master = allRegisFlat();
  const opname = DATA.stockOpname || {checked:{}, unlisted:[]};
  const items = master.map(m => ({
    regis: m.regis, kode: m.kode, nama: m.nama, isNew:false,
    status: opname.checked[m.regis] ? 'checked' : 'unchecked',
    date: opname.checked[m.regis] ? opname.checked[m.regis].date : null
  }));
  (opname.unlisted || []).forEach((u, idx) => {
    items.push({regis: u.regis, kode: null, nama: null, isNew:true, idx, status:'new', date: u.date});
  });
  const order = {unchecked:0, new:1, checked:2};
  items.sort((a,b) => (order[a.status]-order[b.status]) || (a.regis||'').localeCompare(b.regis||''));
  return items;
}

function opnamePill(status){
  if(status==='checked') return `<span class="pill ok"><span class="d"></span>Sudah di-opname</span>`;
  if(status==='new') return `<span class="pill warn"><span class="d"></span>Baru — tidak terdaftar</span>`;
  return `<span class="pill borrowed"><span class="d"></span>Belum di-opname</span>`;
}

async function processScan(regisRaw){
  const regis = regisRaw.trim();
  if(!regis) return;
  const master = allRegisFlat();
  const found = master.find(m => m.regis === regis || m.regis.toLowerCase() === regis.toLowerCase());
  DATA.stockOpname = DATA.stockOpname || {checked:{}, unlisted:[]};
  if(found){
    if(DATA.stockOpname.checked[found.regis]){
      toast(`${found.regis} sudah tercatat sebelumnya — sudah di-opname`);
    } else {
      DATA.stockOpname.checked[found.regis] = {date: todayStr()};
      await saveState();
      toast(`${found.regis} ditandai sudah di-opname (${found.kode})`);
    }
  } else {
    const already = (DATA.stockOpname.unlisted||[]).find(u => u.regis.toLowerCase() === regis.toLowerCase());
    if(already){
      toast(`${regis} sudah tercatat sebagai keterangan baru sebelumnya`, true);
    } else {
      DATA.stockOpname.unlisted = DATA.stockOpname.unlisted || [];
      DATA.stockOpname.unlisted.push({regis, date: todayStr()});
      await saveState();
      toast(`${regis} tidak terdaftar di Real Stok — dicatat sebagai keterangan baru`, true);
    }
  }
  renderTabInto();
  const input = document.getElementById('scanInput');
  if(input){ input.value=''; input.focus(); }
}

    e.preventDefault();

    );

  document.querySelectorAll('[data-remove-new]').forEach(b => b.addEventListener('click', async ()=>{
    const idx = Number(b.dataset.removeNew);
    DATA.stockOpname.unlisted.splice(idx, 1);
    await saveState();
    toast('Catatan dihapus');
    renderTabInto();
  }));
}

// ---------- master kode spek ----------
let masterFilter = '';
function renderMaster(){
  const q = masterFilter.trim().toLowerCase();
  let rows = DATA.masterKodeSpek.filter(r =>
    !q || (r['KODE SPEK']||'').toLowerCase().includes(q) || (r['NAMA PERANGKAT']||'').toLowerCase().includes(q));
  const capped = rows.slice(0, 300);
  return `
  <div class="panel">
    <h2>Master Kode Spek</h2>
    <p class="sub">Kamus referensi kode spek → nama perangkat</p>
    <div class="toolbar">
      <input type="text" id="mkSearch" placeholder="Cari kode spek atau nama perangkat…" value="${esc(masterFilter)}">
      <span class="count">${fmtNum(rows.length)} dari ${fmtNum(DATA.masterKodeSpek.length)}${rows.length>300?' (menampilkan 300 pertama)':''}</span>
    </div>
    <div class="tablewrap">
    <table>
      <thead><tr><th>Kode spek</th><th>Nama perangkat</th></tr></thead>
      <tbody>
        ${capped.length ? capped.map(r => `<tr>
          <td><code class="k">${esc(r['KODE SPEK'])}</code></td>
          <td>${esc(r['NAMA PERANGKAT'])}</td>
        </tr>`).join('') : `<tr><td colspan="2" class="empty">Tidak ditemukan</td></tr>`}
      </tbody>
    </table>
    </div>
  </div>
  `;
}
function wireMaster(){
  document.getElementById('mkSearch').addEventListener('input', e=>{ masterFilter = e.target.value; renderTabInto(); });
}

// ---------- datalist for kode spek autocomplete ----------
function kodeSpekDatalist(){
  const set = new Map();
  DATA.masterKodeSpek.forEach(r => set.set(r['KODE SPEK'], r['NAMA PERANGKAT']));
  DATA.realStok.forEach(r => { if(!set.has(r.KODE_SPEK)) set.set(r.KODE_SPEK, r.NAMA_PERANGKAT); });
  let opts = '';
  set.forEach((nama, kode) => { opts += `<option value="${esc(kode)}">${esc(nama||'')}</option>`; });
  return `<datalist id="kodeSpekList">${opts}</datalist>`;
}

// ---------- router ----------
const TABS = {
  dashboard: {render: renderDashboard, wire: null},
  realstok: {render: renderRealStok, wire: wireRealStok},
  opname: {render: renderOpname, wire: wireOpname},
  masuk: {render: renderMasuk, wire: wireMasuk},
  keluar: {render: renderKeluar, wire: wireKeluar},
  tools: {render: renderTools, wire: wireTools},
  master: {render: renderMaster, wire: wireMaster},
};

function renderTabInto(){
  const content = document.getElementById('content');

  // preserve focus + cursor position across re-renders (fixes search inputs losing focus while typing)
  const active = document.activeElement;
  const activeId = active && active.id;
  const activeTag = active && active.tagName;
  const isTextInput = activeTag === 'INPUT' || activeTag === 'TEXTAREA';
  const selStart = (isTextInput && typeof active.selectionStart === 'number') ? active.selectionStart : null;
  const selEnd = (isTextInput && typeof active.selectionEnd === 'number') ? active.selectionEnd : null;

  const t = TABS[ACTIVE_TAB];
  content.innerHTML = t.render() + kodeSpekDatalist();
  if(t.wire) t.wire();
  document.getElementById('lastUpdated').textContent = `${DATA.realStok.length} SKU · diperbarui otomatis`;

  if(activeId){
    const el = document.getElementById(activeId);
    if(el){
      el.focus();
      if(selStart !== null && el.setSelectionRange){
        try{ el.setSelectionRange(selStart, selEnd); }catch(e){ /* ignore */ }
      }
    }
  }
}

function renderAll(){
  document.querySelectorAll('nav.tabs button').forEach(b=>{
    b.classList.toggle('active', b.dataset.tab === ACTIVE_TAB);
  });
  renderTabInto();
}

document.getElementById('tabs').addEventListener('click', e=>{
  const btn = e.target.closest('button[data-tab]');
  if(!btn) return;
  ACTIVE_TAB = btn.dataset.tab;
  renderAll();
});
document.getElementById('resetBtn').addEventListener('click', resetState);

(async function init(){
  const modeEl = document.getElementById('storageMode');
  if(modeEl){
    modeEl.textContent = HAS_CLAUDE_STORAGE ? 'Tersimpan di penyimpanan Claude (per perangkat)' : 'Tersimpan di server — dibagikan ke semua pengguna';
  }
  await loadState();
  renderAll();
})();

</script>
